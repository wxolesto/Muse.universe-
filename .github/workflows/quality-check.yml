name: MUSE quality check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Report dependency vulnerabilities
        continue-on-error: true
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e "const a=require('./npm-audit-report.json'); const v=a.metadata?.vulnerabilities||{}; console.log('Dependency audit:', JSON.stringify(v)); for (const [name,item] of Object.entries(a.vulnerabilities||{})) console.log(name + ': ' + item.severity + ' | direct=' + item.isDirect + ' | fix=' + JSON.stringify(item.fixAvailable));"
      - name: Build production app
        run: npm run build